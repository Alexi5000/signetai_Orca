name: readme-lint
on:
  pull_request:
    paths:
      - "README.md"
      - "docs/**/*.md"
      - "scripts/checks/**"
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.11"
      - run: bun test scripts/checks
      - run: bun scripts/checks/run-readme-checks.ts
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8
        with:
          args: >-
            --no-progress
            --exclude '^https://x\.com/AlexCinovoj/?$'
            --exclude '^https://www\.linkedin\.com/in/alexcinovoj/?$'
            --exclude '^https://www\.npmjs\.com/package/signetai/?$'
            README.md docs/ORCA-HERO-STORY.md docs/assets/README.md
      - name: Verify package destination through npm registry
        run: npm view signetai name version
