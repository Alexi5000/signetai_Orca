name: Deploy Documentation

on:
  pull_request:
    paths:
      - "web/docs/**"
      - "CONTRIBUTING.md"
      - "ROADMAP.md"
      - "scripts/sync-root-docs.ts"
      - ".github/workflows/deploy-docs.yml"
  push:
    branches: [main]
    paths:
      - "web/docs/**"
      - "CONTRIBUTING.md"
      - "ROADMAP.md"
      - "scripts/sync-root-docs.ts"
      - ".github/workflows/deploy-docs.yml"

permissions:
  contents: read

concurrency:
  group: docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.23.4"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify root-derived docs
        run: bun scripts/sync-root-docs.ts --check

      - name: Validate public content
        run: bun run --cwd web/docs validate:content

      - name: Typecheck documentation site
        run: bun run --cwd web/docs check

      - name: Build documentation site
        run: bun run --cwd web/docs build

      - name: Validate deployment configuration
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.ENABLE_DOCS_DEPLOY == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::CLOUDFLARE_API_TOKEN is required"; exit 1; }
          [[ "$CLOUDFLARE_ACCOUNT_ID" =~ ^[a-f0-9]{32}$ ]] || { echo "::error::Configure the owned Cloudflare account ID"; exit 1; }
          [[ "$CLOUDFLARE_PAGES_PROJECT" =~ ^[a-z0-9][a-z0-9-]{0,57}[a-z0-9]$ ]] || { echo "::error::Configure the owned Pages project"; exit 1; }

      - name: Deploy to Cloudflare Pages
        id: deploy
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.ENABLE_DOCS_DEPLOY == 'true'
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: web/docs
          command: pages deploy dist --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }} --branch=main
          packageManager: bun

      - name: Record validation-only run
        if: github.event_name != 'push' || github.ref != 'refs/heads/main' || vars.ENABLE_DOCS_DEPLOY != 'true'
        run: echo "Documentation validation passed. Deployment was not requested; configure an owned Cloudflare account/project and ENABLE_DOCS_DEPLOY=true to enable main-branch deployment." >> "$GITHUB_STEP_SUMMARY"

      - name: Record deployment URL
        if: steps.deploy.outcome == 'success'
        run: echo "Documentation deployment ${{ steps.deploy.outputs.deployment-url }}" >> "$GITHUB_STEP_SUMMARY"
