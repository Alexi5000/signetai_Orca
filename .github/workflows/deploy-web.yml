name: Deploy Website

on:
  pull_request:
    paths:
      - "web/marketing/**"
      - "platform/core/**"
      - "surfaces/dashboard/**"
      - "package.json"
      - "bun.lock"
      - "scripts/website-workflow.test.ts"
      - ".github/workflows/deploy-web.yml"
  push:
    branches: [main]
    paths:
      - "web/marketing/**"
      - "surfaces/dashboard/**"
      - ".github/workflows/deploy-web.yml"
      - "platform/core/**"
      - "surfaces/dashboard/**"
      - "package.json"
      - "bun.lock"
      - "scripts/website-workflow.test.ts"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      PUBLIC_POSTHOG_ENV: production

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6

        with:
          bun-version-file: package.json

      - name: Verify deployment workflow
        run: bun test scripts/website-workflow.test.ts

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build core package
        run: bun run --filter '@signet/core' build

      - name: Build
        run: bun run --cwd web/marketing build

      - name: Validate Worker bundle
        working-directory: web/marketing
        run: bunx --no-install wrangler deploy --dry-run --name signet-website-validation

      - name: Validate deployment configuration
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.ENABLE_WEBSITE_DEPLOY == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_WORKER_NAME: ${{ vars.CLOUDFLARE_WORKER_NAME }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::CLOUDFLARE_API_TOKEN is required"; exit 1; }
          [[ "$CLOUDFLARE_ACCOUNT_ID" =~ ^[a-f0-9]{32}$ ]] || { echo "::error::Configure the owned Cloudflare account ID"; exit 1; }
          [[ "$CLOUDFLARE_WORKER_NAME" =~ ^[a-z][a-z0-9-]{0,61}[a-z0-9]$ ]] || { echo "::error::Configure the owned Worker name"; exit 1; }

      - name: Deploy to Cloudflare
        id: deploy
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.ENABLE_WEBSITE_DEPLOY == 'true'
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: web/marketing
          command: deploy --name=${{ vars.CLOUDFLARE_WORKER_NAME }}
          packageManager: bun

      - name: Record validation-only run
        if: github.event_name != 'push' || github.ref != 'refs/heads/main' || vars.ENABLE_WEBSITE_DEPLOY != 'true'
        run: echo "Website validation passed. Deployment was not requested; configure an owned Cloudflare account/Worker and ENABLE_WEBSITE_DEPLOY=true to enable main-branch deployment." >> "$GITHUB_STEP_SUMMARY"
