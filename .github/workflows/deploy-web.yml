name: Deploy Website

on:
  push:
    branches: [main]
    paths:
      - "web/marketing/**"
      - ".github/workflows/deploy-web.yml"
      - "!**/*.test.*"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # This workflow builds the website, not the Electron desktop app.
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      # The runtime hostname gate is a second boundary for preview/local builds.
      PUBLIC_POSTHOG_ENV: production
    if: "!contains(github.event.head_commit.message, 'chore: release')"

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build core package
        run: bun run --filter '@signet/core' build

      - name: Build
        run: bun run --cwd web/marketing build

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: a19f770b9be1b20e78b8d25bdcfd3bbd
          workingDirectory: web/marketing
          command: deploy
          packageManager: bun
