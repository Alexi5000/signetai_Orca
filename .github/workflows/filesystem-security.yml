name: Filesystem Security
on:
  pull_request:
    paths:
      - 'surfaces/desktop/**'
      - 'platform/core/**'
      - 'platform/daemon/**'
      - 'integrations/pi/extension-base/**'
      - '.github/workflows/filesystem-security.yml'
  push:
    branches: [main]
    paths:
      - 'surfaces/desktop/**'
      - 'platform/core/**'
      - 'platform/daemon/**'
      - 'integrations/pi/extension-base/**'
      - '.github/workflows/filesystem-security.yml'
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      - run: bun install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: bun run build:core
      - name: Filesystem containment and native cache regression tests
        run: bun run test:hermetic platform/core/src/secure-fs.test.ts platform/daemon/src/native-runtime-assets.test.ts platform/daemon/src/test-temp-dir.test.ts platform/daemon/src/event-loop-responsiveness.test.ts platform/daemon/src/native-memory-source-worker.test.ts
      - name: Marketplace stream and configuration boundaries
        run: bun run test:hermetic platform/daemon/src/routes/marketplace-readme.test.ts platform/daemon/src/routes/marketplace.test.ts platform/daemon/src/routes/marketplace-write-boundary.test.ts platform/daemon/src/routes/marketplace-reviews.test.ts
      - name: Secret publication concurrency and authentication
        run: bun run test:hermetic platform/daemon/src/auth/auth.test.ts platform/daemon/src/middleware-origin.test.ts
      - name: Imported HTML text projection regressions
        run: bun run test:hermetic platform/daemon/src/import-normalizer.test.ts
      - name: Transcript atomic replacement and recovery
        run: bun run test:hermetic platform/daemon/src/transcript-jsonl.test.ts
      - name: Bounded token, memory, and transcript parsing
        run: bun run test:hermetic platform/daemon/src/sync-db-site-token.test.ts platform/core/src/__tests__/memory.test.ts platform/core/src/__tests__/import-headings.test.ts platform/core/src/identity-summary.test.ts integrations/pi/extension-base/src/transcript.test.ts
      - name: Desktop private logs and daemon restart regressions
        run: bun run test:hermetic platform/core/src/daemon-logs.test.ts surfaces/cli/src/lib/runtime.test.ts surfaces/desktop/src/daemon-logs.test.ts surfaces/desktop/src/daemon-manager-regression.test.ts surfaces/desktop/src/daemon-manager.test.ts
  desktop-macos:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      - run: bun install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: bun run build:core
      - name: Desktop log filesystem and restart regressions
        run: bun run test:hermetic platform/core/src/daemon-logs.test.ts surfaces/desktop/src/daemon-logs.test.ts surfaces/desktop/src/daemon-manager-regression.test.ts surfaces/desktop/src/daemon-manager.test.ts
