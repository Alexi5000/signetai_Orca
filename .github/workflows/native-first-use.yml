name: Native First-Use Acceptance

on:
  pull_request:
    paths:
      - "platform/core/**"
      - "platform/daemon/**"
      - "surfaces/cli/**"
      - "scripts/build-native-bun.ts"
      - "scripts/native-first-use-smoke.test.ts"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/native-first-use.yml"
  push:
    branches: [main]
    paths:
      - "platform/core/**"
      - "platform/daemon/**"
      - "surfaces/cli/**"
      - "scripts/build-native-bun.ts"
      - "scripts/native-first-use-smoke.test.ts"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/native-first-use.yml"

permissions:
  contents: read

jobs:
  first-use:
    name: Compiled ${{ matrix.os }} setup, doctor, remember, and recall
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build workspace dependencies
        run: bun run build
      - name: Build dashboard assets
        run: bun run build:dashboard
      - name: Build native Signet binary
        run: bun run build:native-bun
      - name: Run compiled first-use acceptance
        env:
          SIGNET_NATIVE_FIRST_USE_SMOKE: "1"
          SIGNET_NATIVE_SMOKE_BINARY: ./dist/native/signet
        run: bun test scripts/native-first-use-smoke.test.ts
