name: Workflow security regression
on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - "scripts/workflow-security.test.ts"
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "scripts/workflow-security.test.ts"
permissions:
  contents: read
jobs:
  workflow-security:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: package.json
      - run: bun test scripts/workflow-security.test.ts
